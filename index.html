<!DOCTYPE html>
<html lang="ja">
<head>

  <title>拓実 AR</title>

<body>

  <script>
    window.AR_CONFIG = {
      video: 'assets/videos/takumi2.mp4',

        { icon: 'assets/images/icon_insta.png',   url: 'https://www.instagram.com/singer_takumi' },
        { icon: 'assets/images/icon_tiktok.png',  url: 'https://www.tiktok.com/@phenomellow_i.takumi' }
      ],

      debug: true

  <script src="js/ar-core.js"></script>
